<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Cabinet of Curiosities</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p class="eyebrow">A PRIVATE COLLECTION · 私人收藏室</p>
    <h1>The Cabinet<br>of Curiosities</h1>
    <p>每一件藏品，都藏着一个尚待探寻的问题。</p>
  </header>
  <main>
    <section id="study" class="room" aria-label="可旋转观察的三维私人书斋">
      <p id="scene-status" role="status">正在布置书斋……</p>
    </section>
    <p class="room-note">单指或鼠标拖动观察 · 双指捏合或滚轮缩放 · 轻触浑天仪打开札记</p>
    <button id="open-note" type="button" aria-haspopup="dialog">浑天仪 · 研究札记</button>
  </main>
  <footer>OBSERVE · QUESTION · WONDER<span>观察 / 提问 / 惊叹</span></footer>
  <dialog id="question-card" aria-labelledby="card-title">
    <form id="question-form">
      <p class="eyebrow">COLLECTOR’S NOTES · 藏品札记</p>
      <h2 id="card-title"></h2>
      <label for="question">问题与思考</label>
      <textarea id="question" rows="7"></textarea>
      <p id="save-status" role="status">修改后，点击保存以保留札记。</p>
      <div class="actions">
        <button type="button" id="close-card">关闭</button>
        <button type="submit" class="save">保存札记</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="script.js"></script>
</body>
</html>
